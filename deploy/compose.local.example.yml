# Private-mode overlay for deploy/docker-compose.yml. OPTIONAL, and a
# TEMPLATE: copy it, edit the path, name it explicitly:
#
#   docker compose -f deploy/docker-compose.yml \
#                  -f deploy/compose.local.yml up -d
#
# The base file alone is a correct private deployment — it reads the whole
# `deploy/.env` via `env_file`, so your auth mode reaches the process. What
# this overlay adds is operational: the corpus on a host path instead of
# inside a named volume, so backing it up or publishing a snapshot to another
# instance (VACUUM INTO + rsync of keyframes/) is plain file work rather than
# `docker compose exec` archaeology.
#
# Verify the merge the same way the public overlay teaches — the merged model,
# never the YAML:
#
#   docker compose -f deploy/docker-compose.yml -f deploy/compose.local.yml \
#     config --format json | jq '.services.mcp.volumes'
#
# must show exactly ONE mount at /data.
#
# Smoke-testing a private box: `/api/*` is a public-mode route group and 404s
# here BY DESIGN — that 404 is not a broken install. Check instead, THROUGH THE
# EDGE, which is the only listener there is now:
#
#   curl -s localhost:${EDGE_PORT:-8080}/healthz
#   curl -s -H "Authorization: Bearer $VIDTHEQUE_TOKEN" \
#     localhost:${EDGE_PORT:-8080}/dashboard/api/meta
#
# DEVELOPING BEHIND THE EDGE, and why it is worth the two minutes. `pnpm dev`
# runs Next on :3000 and Python on another port, and `web/next.config.ts`
# reproduces the production split with `rewrites()` so the browser still sees
# one origin. That file's `PYTHON_FORM_POSTS` block is a shim for the three
# paths routed by METHOD — a rewrite cannot key on one, so it keys on the form
# encoding instead — and frontend-migration.md §1d says plainly that it is not
# the rule and is deleted the day development runs both processes behind one
# proxy. This is that proxy. Point the base file's `web` service at a
# `pnpm dev` on the host instead of the built image, or run the stack as it is
# and use `docker compose up --build web` after a change: either way the shim
# stops being what routes a write, and the thing under test is the thing that
# will be deployed.
#
# A HOST CADDY IN FRONT OF THE EDGE — one terminating TLS for a name like
# private.vidtheque.dev and proxying to 127.0.0.1:${EDGE_PORT} — does not close
# the LAN off by itself: the base file's `${EDGE_PORT:-8080}:80` publishes on
# every interface, so the plain-http edge stays reachable beside it. Close the
# port at the box firewall, or restate the mapping here with a `127.0.0.1:`
# prefix under `ports: !override` — appending would leave both. The other
# constraint is the host caddy's, and deploy/Caddyfile's header states it: it
# must pass `Host` through unchanged.
#
# This overlay adds no new environment variables. The host path below is the
# one thing to edit.

services:
  mcp:
    # **`!override` is load-bearing.** Compose merges sequence fields by
    # APPENDING, so restating `volumes:` without it mounts BOTH the base
    # file's named volume and this bind at /data — the same trap the public
    # overlay documents for `ports:` (audit B-1), with the same silent
    # failure. The named volume then still exists but holds nothing.
    volumes: !override
      - /srv/vidtheque-data:/data
