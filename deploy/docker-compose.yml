# vidtheque — reference deployment, for a PRIVATE instance on your own network.
#
#   docker compose up -d                      caddy + web + mcp + worker
#
# FOUR SERVICES SINCE THE FRONT END MOVED TO NEXT.js. `caddy` is the origin
# everything reaches — it routes each request to the front end or to Python by
# path, and three paths by method, which is the split
# `docs/design/frontend-migration.md` §1a and §1d settle and which neither
# process can express on its own. `deploy/Caddyfile` is that rule; this file
# only decides where the edge is published.
#
# So `mcp` HAS NO PUBLISHED PORT ANY MORE. Caddy is its only client and reaches
# it on this network as http://mcp:8080, and `web` the same way. The smoke test
# on the box goes through the edge instead:
#
#   curl -s http://127.0.0.1:${EDGE_PORT:-8080}/healthz
#
# GOING PUBLIC NEEDS THE OVERLAY, NOT THE `tunnel` PROFILE ON ITS OWN.
# The `mcp` service reads the whole `.env` via `env_file` (so your mode flags
# do reach the process — this file used to hand it four variables by name and
# nothing else, and a private box that set VIDTHEQUE_AUTH=token booted
# AUTH=none; field report 2026-08-12). What this file still gets wrong for a
# public deployment is the BIND: the port publishes on 0.0.0.0, so behind a
# tunnel the origin stays reachable off-tunnel and a request that skipped
# Cloudflare can forge CF-Connecting-IP. The overlay closes that. Use:
#
#   docker compose -f deploy/docker-compose.yml \
#                  -f deploy/compose.public.example.yml \
#                  --profile tunnel up -d
#
# and read docs/deploy-public.md first — §6.1 is this paragraph with receipts.
# (The bind that matters is now the EDGE's, since it is the only one there is.)
#
# No GPU? Dropping the `worker` service and pointing WORKER_URL at a hosted
# OpenAI-compatible provider covers the transcript leg — `/v1/embeddings`, both
# indexing and query side. It does NOT cover frame search or on-screen text:
# those need `/v1/embeddings/image`, `/v1/embeddings/frame-query` and `/v1/ocr`
# at the same base URL, which no ordinary provider serves. Run the worker, or
# a shim that answers all five paths.
#
# Every variable below is documented in .env.example. Copy it to .env first.

name: vidtheque

services:
  mcp:
    # Built from source: `mcp/Dockerfile` is the real image (Python 3.12,
    # CPU-only, multi-arch). Published tags now exist — the GHCR workflow fires
    # on a `v*` git tag and pushes both images — so a box that should run a
    # release rather than build one overlays deploy/compose.release.example.yml,
    # which swaps in `image: ghcr.io/t0msilver/vidtheque-mcp:${IMAGE_TAG}` and
    # resets this `build:` so nothing silently rebuilds. THE IMAGE TAGS CARRY NO
    # LEADING `v`: git tag `v0.0.1` publishes `0.0.1` and `0.0`.
    build:
      context: ..
      dockerfile: mcp/Dockerfile
    image: vidtheque-mcp:dev
    restart: unless-stopped
    # The whole .env, in every mode. `.env` is compose's *interpolation*
    # source, not the container's environment; without this line
    # VIDTHEQUE_AUTH=token in .env is read by nobody and the server boots
    # AUTH=none with the write tools registered — silently, since on a LAN
    # nothing visibly breaks. The explicit `environment:` entries below win
    # over env_file, so the four-variable contract is unchanged.
    env_file:
      - .env
    environment:
      WORKER_URL: ${WORKER_URL:-http://worker:8081}
      VIDTHEQUE_DATA_DIR: /data
      VIDTHEQUE_PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      VIDTHEQUE_LOG_LEVEL: ${LOG_LEVEL:-info}
      # `env_file` hands this container the whole .env, which includes the
      # tunnel token — a credential mcp has no use for and anyone holding can
      # run the tunnel. Blanked here for this service only; cloudflared still
      # interpolates the real value. (2026-08-10 audit, F-7.)
      TUNNEL_TOKEN: ""
    volumes:
      - vidtheque-data:/data
    # NOT PUBLISHED. It was `"${MCP_PORT:-8080}:8080"` until the edge existed,
    # and MCP_PORT is gone from .env.example with it. Caddy is the only client
    # and reaches it on this network; a published port here would be a second
    # way in, which is precisely what makes trusting `CF-Connecting-IP` unsound
    # (docs/deploy-public.md §4). To reach it on the box for a diagnosis, do it
    # from inside: `docker compose exec mcp curl -s localhost:8080/healthz`.
    depends_on:
      - worker

  web:
    # The Next.js front end (`web/Dockerfile`, built from `web/` alone). A
    # released box runs the published image instead: the GHCR workflow pushes
    # ghcr.io/t0msilver/vidtheque-web on a `v*` tag beside the other two, and
    # deploy/compose.release.example.yml swaps it in and resets this `build:`.
    build:
      context: ../web
      dockerfile: Dockerfile
    image: vidtheque-web:dev
    restart: unless-stopped
    # NO `env_file`, deliberately, for the reason the worker has one in the
    # public overlay's comment (2026-08-10 audit, F-7): this container needs
    # exactly two variables, and the whole `.env` would hand it
    # OPENROUTER_API_KEY and TUNNEL_TOKEN — a credential and a key it has no
    # use for, readable through `docker inspect` on a process the internet
    # talks to.
    environment:
      # The reads THIS SERVER makes for a page — search, videos, meta — inside
      # the compose network. A browser never uses it: browsers reach Python
      # through caddy by path, so the session cookie, `/api/ask` and every
      # frame cross one process fewer (frontend-migration.md §1c, decision 2).
      VIDTHEQUE_API_URL: http://mcp:8080
      # The header those reads carry the visitor's address under. It MUST equal
      # the instance's VIDTHEQUE_TRUSTED_IP_HEADER — hence one variable, read
      # twice from the same `.env` — or every visitor this server reads for
      # shares one rate-limit bucket.
      VIDTHEQUE_CLIENT_IP_HEADER: ${VIDTHEQUE_TRUSTED_IP_HEADER:-CF-Connecting-IP}
    # Not published either, for the same reason as mcp: caddy reaches it as
    # http://web:3000 and nothing else has business talking to it.
    depends_on:
      - mcp

  caddy:
    # THE EDGE — the one origin, in both topologies. Its rule is
    # deploy/Caddyfile, mounted read-only because a proxy that can rewrite its
    # own configuration is a proxy an application bug can re-route.
    #
    # Pinned by DIGEST as well as by tag, which is what the cloudflared entry
    # below only recommends: this container decides which process answers a
    # request, so "whatever the registry serves next time" is not a thing to
    # leave to chance. To move it deliberately:
    #   docker buildx imagetools inspect caddy:<version>   # prints the digest
    # and set CADDY_VERSION to `<version>@sha256:<digest>`.
    image: caddy:${CADDY_VERSION:-2.11.4@sha256:df7f1c2fb114453b951de51a98efc010db1655a92c2e86be6706714e2417a78d}
    restart: unless-stopped
    volumes:
      # THE FILE HAS TO BE THERE. Compose creates a missing bind source as a
      # DIRECTORY, so a deployment that fetched the two compose files and not
      # this one gets `/etc/caddy/Caddyfile` as an empty directory and an edge
      # that will not start. `deploy/vidtheque-update.sh` fetches it beside
      # them, pinned to the same release tag, and the README's quickstart curls
      # it — one more `-O`, for exactly this reason.
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    # No volume for /data: TLS terminates in front of this container (the
    # tunnel, or the LAN), so caddy never asks for a certificate and has
    # nothing durable to keep.
    ports:
      # 0.0.0.0 here, because a private box on a LAN is what this file is for.
      # THE PUBLIC OVERLAY REPLACES THIS WITH A LOOPBACK PUBLICATION so that
      # cloudflared is the only way in — that is the bind the runbook's §4
      # argument rests on, and it is now this line rather than mcp's.
      - "${EDGE_PORT:-8080}:80"
    depends_on:
      - mcp
      - web

  worker:
    build:
      context: ..
      dockerfile: worker/Dockerfile
    image: vidtheque-worker:dev
    restart: unless-stopped
    environment:
      # backend selection
      STT_BACKEND: ${STT_BACKEND:-whisperx}
      # One model for both embedding tasks: when these four agree, the worker
      # loads it once into one shared slot. Split them (qwen3-embedding +
      # siglip2) and it is two models in two slots.
      EMBED_BACKEND: ${EMBED_BACKEND:-qwen3-vl-embedding}
      IMAGE_EMBED_BACKEND: ${IMAGE_EMBED_BACKEND:-qwen3-vl-embedding}
      OCR_BACKEND: ${OCR_BACKEND:-rapidocr}
      STT_MODEL: ${STT_MODEL:-large-v3}
      EMBED_MODEL: ${EMBED_MODEL:-Qwen/Qwen3-VL-Embedding-2B}
      IMAGE_EMBED_MODEL: ${IMAGE_EMBED_MODEL:-Qwen/Qwen3-VL-Embedding-2B}
      EMBED_DIM: ${EMBED_DIM:-0}
      EMBED_QUERY_PROMPT: ${EMBED_QUERY_PROMPT:-}
      FRAME_QUERY_PROMPT: ${FRAME_QUERY_PROMPT:-}
      EMBED_BATCH_SIZE: ${EMBED_BATCH_SIZE:-16}
      IMAGE_EMBED_BATCH_SIZE: ${IMAGE_EMBED_BATCH_SIZE:-8}
      IMAGE_EMBED_MAX_PATCHES: ${IMAGE_EMBED_MAX_PATCHES:-256}
      # device
      DEVICE: ${DEVICE:-auto}
      COMPUTE_TYPE: ${COMPUTE_TYPE:-auto}
      STT_BATCH_SIZE: ${STT_BATCH_SIZE:-16}
      STT_ALIGN: ${STT_ALIGN:-1}
      GPU_INDEX: ${GPU_INDEX:-0}
      OCR_THREADS: ${OCR_THREADS:-4}
      # lifecycle
      IDLE_UNLOAD_SECONDS: ${IDLE_UNLOAD_SECONDS:-300}
      EMBED_RESIDENT: ${EMBED_RESIDENT:-0}
      SHUTDOWN_GRACE_SECONDS: ${SHUTDOWN_GRACE_SECONDS:-30}
      VRAM_HEADROOM_MB: ${VRAM_HEADROOM_MB:-512}
      # GPU lease hooks — run inside this container, so whatever they call must
      # be reachable from here (an HTTP endpoint on the host is the usual answer).
      GPU_ACQUIRE_CMD: ${GPU_ACQUIRE_CMD:-}
      GPU_RELEASE_CMD: ${GPU_RELEASE_CMD:-}
      GPU_HOOK_TIMEOUT_SECONDS: ${GPU_HOOK_TIMEOUT_SECONDS:-60}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HF_HOME: /hf-cache
    volumes:
      # Model weights survive container rebuilds. Several GB — keep it.
      - hf-cache:/hf-cache
    ports:
      - "${WORKER_PORT:-8081}:8081"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  cloudflared:
    profiles: ["tunnel"]
    # `:latest` on the one container that terminates your public hostname means
    # whatever the registry serves the next time this is pulled. Pin it — and
    # prefer a digest over a tag when you do: `docker buildx imagetools inspect
    # cloudflare/cloudflared:<version>` prints one. (2026-08-10 audit, F-28.)
    image: cloudflare/cloudflared:${CLOUDFLARED_VERSION:-2026.7.1}
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      # Not `${TUNNEL_TOKEN:?…}`: interpolation runs over the whole file before
      # profiles are filtered, so a required-variable guard here breaks every
      # compose command for people who never asked for the tunnel. cloudflared
      # complains clearly enough on its own when the token is empty.
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    # The edge, not mcp: the tunnel's ingress points at caddy now, and path
    # routing lives in deploy/Caddyfile rather than in an ingress rule. Inside
    # this network that service URL is http://caddy:80.
    depends_on:
      - caddy

volumes:
  vidtheque-data:
  hf-cache:
