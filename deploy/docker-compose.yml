# vidtheque — reference deployment, for a PRIVATE instance on your own network.
#
#   docker compose up -d                      mcp + worker
#
# GOING PUBLIC NEEDS THE OVERLAY, NOT THE `tunnel` PROFILE ON ITS OWN.
# This file hands the `mcp` container four variables by name and nothing else,
# because `.env` is compose's *interpolation* source and not the container's
# environment — so VIDTHEQUE_PUBLIC_READONLY and VIDTHEQUE_AUTH sit in `.env`
# read by nobody, the write tools stay registered, and the port publishes on
# 0.0.0.0. Behind a tunnel that is an open indexing service. Use:
#
#   docker compose -f deploy/docker-compose.yml \
#                  -f deploy/compose.public.example.yml \
#                  --profile tunnel up -d
#
# and read docs/deploy-public.md first — §6.1 is this paragraph with receipts.
#
# No GPU? Dropping the `worker` service and pointing WORKER_URL at a hosted
# OpenAI-compatible provider covers the transcript leg — `/v1/embeddings`, both
# indexing and query side. It does NOT cover frame search or on-screen text:
# those need `/v1/embeddings/image`, `/v1/embeddings/frame-query` and `/v1/ocr`
# at the same base URL, which no ordinary provider serves. Run the worker, or
# a shim that answers all five paths.
#
# Every variable below is documented in .env.example. Copy it to .env first.

name: vidtheque

services:
  mcp:
    # Built from source: `mcp/Dockerfile` is the real image (Python 3.12,
    # CPU-only, multi-arch), and there is no published tag yet. Swap `build`
    # for `image: ghcr.io/t0msilver/vidtheque-mcp:<tag>` once there is one —
    # the GHCR publish workflow fires on a `v*` git tag.
    build:
      context: ..
      dockerfile: mcp/Dockerfile
    image: vidtheque-mcp:dev
    restart: unless-stopped
    environment:
      WORKER_URL: ${WORKER_URL:-http://worker:8081}
      VIDTHEQUE_DATA_DIR: /data
      VIDTHEQUE_PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      VIDTHEQUE_LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - vidtheque-data:/data
    ports:
      - "${MCP_PORT:-8080}:8080"
    depends_on:
      - worker

  worker:
    build:
      context: ..
      dockerfile: worker/Dockerfile
    image: vidtheque-worker:dev
    restart: unless-stopped
    environment:
      # backend selection
      STT_BACKEND: ${STT_BACKEND:-whisperx}
      # One model for both embedding tasks: when these four agree, the worker
      # loads it once into one shared slot. Split them (qwen3-embedding +
      # siglip2) and it is two models in two slots.
      EMBED_BACKEND: ${EMBED_BACKEND:-qwen3-vl-embedding}
      IMAGE_EMBED_BACKEND: ${IMAGE_EMBED_BACKEND:-qwen3-vl-embedding}
      OCR_BACKEND: ${OCR_BACKEND:-rapidocr}
      STT_MODEL: ${STT_MODEL:-large-v3}
      EMBED_MODEL: ${EMBED_MODEL:-Qwen/Qwen3-VL-Embedding-2B}
      IMAGE_EMBED_MODEL: ${IMAGE_EMBED_MODEL:-Qwen/Qwen3-VL-Embedding-2B}
      EMBED_DIM: ${EMBED_DIM:-0}
      EMBED_QUERY_PROMPT: ${EMBED_QUERY_PROMPT:-}
      FRAME_QUERY_PROMPT: ${FRAME_QUERY_PROMPT:-}
      EMBED_BATCH_SIZE: ${EMBED_BATCH_SIZE:-16}
      IMAGE_EMBED_BATCH_SIZE: ${IMAGE_EMBED_BATCH_SIZE:-8}
      IMAGE_EMBED_MAX_PATCHES: ${IMAGE_EMBED_MAX_PATCHES:-256}
      # device
      DEVICE: ${DEVICE:-auto}
      COMPUTE_TYPE: ${COMPUTE_TYPE:-auto}
      STT_BATCH_SIZE: ${STT_BATCH_SIZE:-16}
      STT_ALIGN: ${STT_ALIGN:-1}
      GPU_INDEX: ${GPU_INDEX:-0}
      OCR_THREADS: ${OCR_THREADS:-4}
      # lifecycle
      IDLE_UNLOAD_SECONDS: ${IDLE_UNLOAD_SECONDS:-300}
      EMBED_RESIDENT: ${EMBED_RESIDENT:-0}
      SHUTDOWN_GRACE_SECONDS: ${SHUTDOWN_GRACE_SECONDS:-30}
      VRAM_HEADROOM_MB: ${VRAM_HEADROOM_MB:-512}
      # GPU lease hooks — run inside this container, so whatever they call must
      # be reachable from here (an HTTP endpoint on the host is the usual answer).
      GPU_ACQUIRE_CMD: ${GPU_ACQUIRE_CMD:-}
      GPU_RELEASE_CMD: ${GPU_RELEASE_CMD:-}
      GPU_HOOK_TIMEOUT_SECONDS: ${GPU_HOOK_TIMEOUT_SECONDS:-60}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HF_HOME: /hf-cache
    volumes:
      # Model weights survive container rebuilds. Several GB — keep it.
      - hf-cache:/hf-cache
    ports:
      - "${WORKER_PORT:-8081}:8081"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  cloudflared:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      # Not `${TUNNEL_TOKEN:?…}`: interpolation runs over the whole file before
      # profiles are filtered, so a required-variable guard here breaks every
      # compose command for people who never asked for the tunnel. cloudflared
      # complains clearly enough on its own when the token is empty.
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - mcp

volumes:
  vidtheque-data:
  hf-cache:
