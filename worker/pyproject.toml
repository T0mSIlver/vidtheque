[project]
name = "vidtheque-worker"
version = "0.0.1"
description = "vidtheque GPU inference worker — OpenAI-compatible STT/embeddings/OCR with a single GPU lifecycle manager"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Heavy inference stacks. Kept out of the default install so CPU CI and laptop
# checkouts resolve without CUDA wheels.
gpu = [
    "whisperx>=3.8.6",
    "sentence-transformers>=3.0",
    # SigLIP 2 NaFlex needs Siglip2Model, which landed in transformers 4.50;
    # 4.56 is the floor for the `dtype=` kwarg. open_clip cannot load NaFlex
    # from any release, so transformers is the only path.
    #
    # The research doc recommends >=5.14 for the processor's automatic
    # lowercase + pad-to-64 on SigLIP2's *text* tower. That is unsatisfiable
    # here: transformers 5.14 requires huggingface-hub>=1.5, whisperX 3.8.6
    # pins huggingface-hub<1.0, and there is no whisperX release without that
    # cap. So the frame-query path does that preprocessing itself — see
    # `_encode_text` in backends/siglip2_image_embed.py, which passes
    # `padding="max_length", max_length=64, truncation=True` and lowercases the
    # text. Those are 5.x's own defaults, so it stays correct if the pin moves;
    # drop them and query embeddings degrade with nothing in the logs.
    "transformers>=4.56",
    # `rapidocr`, not the frozen `rapidocr-onnxruntime`: the merged package is
    # where PP-OCRv6 lives, and it bundles its default models in the wheel.
    # It deliberately ships no inference engine, so pin one here — floating it
    # lets a rebuild cross a CUDA-major or Python-minimum boundary silently.
    "rapidocr==3.9.2",
    "onnxruntime==1.28.0",
    "numpy>=1.26",
    "pillow>=10.0",
]
# NVML bindings for free-VRAM accounting. Optional: the lifecycle manager
# degrades to "unknown VRAM, allow the load" when it is missing.
nvml = ["nvidia-ml-py>=12.535"]

[project.scripts]
vidtheque-worker = "vidtheque_worker.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vidtheque_worker"]
