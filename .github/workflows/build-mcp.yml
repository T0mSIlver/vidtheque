name: build-mcp

on:
  pull_request:
    paths:
      - "mcp/**"
      - "scripts/image_inputs.sh"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".github/workflows/build-mcp.yml"
  # No `paths` filter on tags; see the note in build-worker.yml.
  push:
    tags:
      - "v*"
      - "mcp-v*"
  workflow_dispatch:

concurrency:
  group: build-mcp-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/t0msilver/vidtheque-mcp
  BASE_IMAGE: ghcr.io/t0msilver/vidtheque-mcp-base

jobs:
  base:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.inputs.outputs.tag }}
      exists: ${{ steps.inputs.outputs.exists }}
    steps:
      - uses: actions/checkout@v4

      # The base tag hashes `uv export`; pin the uv the Dockerfiles use.
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.24"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute base inputs
        id: inputs
        run: |
          tag=$(scripts/image_inputs.sh mcp --tag)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if docker buildx imagetools inspect "$BASE_IMAGE:$tag" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build base for pull request
        if: steps.inputs.outputs.exists != 'true' && !startsWith(github.ref, 'refs/tags/')
        uses: docker/build-push-action@v6
        with:
          context: .
          file: mcp/Dockerfile.base
          platforms: linux/amd64,linux/arm64
          push: false
          tags: ${{ env.BASE_IMAGE }}:${{ steps.inputs.outputs.tag }}

      - name: Build and push base
        if: steps.inputs.outputs.exists != 'true' && startsWith(github.ref, 'refs/tags/')
        uses: docker/build-push-action@v6
        with:
          context: .
          file: mcp/Dockerfile.base
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.BASE_IMAGE }}:${{ steps.inputs.outputs.tag }}

  image:
    # A pull request builds it too, without pushing, when its base is already in the registry.
    if: startsWith(github.ref, 'refs/tags/') || needs.base.outputs.exists == 'true'
    needs: base
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,format=short

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: mcp/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          build-args: BASE_IMAGE=${{ env.BASE_IMAGE }}:${{ needs.base.outputs.tag }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
