name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (cpu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.24"
          enable-cache: true

      # uv's own CPython, as on every dev box: the runner's /usr/bin/python3.12
      # links SQLite 3.45.1, whose VACUUM INTO fails on the generated columns of
      # `videos` (3.46.1 in the image and 3.53 in uv's build do not).
      - name: Use uv's managed Python
        run: echo "UV_PYTHON_PREFERENCE=only-managed" >> "$GITHUB_ENV"

      # No --extra gpu: CI proves the app imports, routes and lifecycle work
      # without torch/onnxruntime. GPU paths are validated by `make bench` on
      # real hardware — a public repo gets no self-hosted runner.
      - name: Sync workspace (CPU deps only)
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest -q

      - name: Check the lockfile is up to date
        run: uv lock --check
