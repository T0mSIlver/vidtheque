name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (cpu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.24"
          enable-cache: true

      # No --extra gpu: CI proves the app imports, routes and lifecycle work
      # without torch/onnxruntime. GPU paths are validated by `make bench` on
      # real hardware — a public repo gets no self-hosted runner.
      - name: Sync workspace (CPU deps only)
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest -q

      - name: Check the lockfile is up to date
        run: uv lock --check
