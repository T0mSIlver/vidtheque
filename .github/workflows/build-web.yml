name: build-web

on:
  pull_request:
    paths:
      - "web/**"
      - "scripts/release_plan.sh"
      - ".github/workflows/build-web.yml"
  # No `paths` filter on tags — see the note in build-worker.yml.
  push:
    tags:
      - "v*"
      - "web-v*"
  workflow_dispatch:

concurrency:
  group: build-web-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/t0msilver/vidtheque-web

jobs:
  # A release whose inputs to this image did not change since the previous
  # release retags that release's image instead of building (publishing.md §4).
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      build: ${{ steps.plan.outputs.build }}
      prev: ${{ steps.plan.outputs.prev }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build or retag
        id: plan
        run: |
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            # Not a release: build, and exercise the planner against the last release.
            scripts/release_plan.sh web "$(git describe --tags --abbrev=0 --match 'v[0-9]*')"
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          scripts/release_plan.sh web "$GITHUB_REF_NAME" | tee plan.txt
          # A retag needs the previous image; a release that never published one builds.
          if grep -qx 'build=false' plan.txt; then
            prev=$(sed -n 's/^prev=//p' plan.txt)
            docker buildx imagetools inspect "$IMAGE:$prev" >/dev/null 2>&1 \
              || { echo "$IMAGE:$prev is not in the registry, building"; sed -i 's/^build=false$/build=true/' plan.txt; }
          fi
          cat plan.txt >> "$GITHUB_OUTPUT"

  retag:
    needs: plan
    if: needs.plan.outputs.build == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      # Registry-side: the new tags point at the previous release's manifest
      # list, so the box's pull of an unchanged image moves no bytes.
      - name: Retag the previous release
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          PREV: ${{ needs.plan.outputs.prev }}
        run: |
          args=()
          while IFS= read -r t; do [[ -n "$t" ]] && args+=(-t "$t"); done <<< "$TAGS"
          docker buildx imagetools create "${args[@]}" "$IMAGE:$PREV"
          docker buildx imagetools inspect "$IMAGE:${GITHUB_REF_NAME#v}"

  build:
    # amd64 only, unlike the mcp image beside it. An arm64 leg here is not a
    # second copy of a wheel set: it is a full Next/SWC compile under QEMU on a
    # hosted runner, on the critical path of every `v*` tag. The front end can
    # gain it the day a box needs it — one `platforms:` value and the
    # setup-qemu step build-mcp.yml carries.
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,format=short

      # The context is `web`, not `.`: the app builds from its own directory
      # (web/Dockerfile's header), and `file:` stays repo-relative.
      - name: Build (and push on tag)
        uses: docker/build-push-action@v6
        with:
          context: web
          file: web/Dockerfile
          platforms: linux/amd64
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
