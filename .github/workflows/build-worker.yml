name: build-worker

on:
  pull_request:
    paths:
      - "worker/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".github/workflows/build-worker.yml"
  # Deliberately no `paths` filter on tags: path filters are evaluated against
  # a push's commit range, and a tag push usually has none — the publish build
  # would silently never run.
  push:
    tags:
      - "v*"
      - "worker-v*"
  workflow_dispatch:

concurrency:
  group: build-worker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/t0msilver/vidtheque-worker

jobs:
  build:
    # amd64 only: the image is CUDA-based and there is no arm64 story for it.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # A CUDA runtime base plus torch wheels does not fit next to the
      # preinstalled toolchains on a stock runner.
      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,format=short

      - name: Build (and push on tag)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: worker/Dockerfile
          platforms: linux/amd64
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker
