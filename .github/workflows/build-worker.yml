name: build-worker

on:
  pull_request:
    paths:
      - "worker/**"
      - "scripts/image_inputs.sh"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - "scripts/release_plan.sh"
      - ".github/workflows/build-worker.yml"
  # Deliberately no `paths` filter on tags: path filters are evaluated against
  # a push's commit range, and a tag push usually has none.
  push:
    tags:
      - "v*"
      - "worker-v*"
  workflow_dispatch:

concurrency:
  group: build-worker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/t0msilver/vidtheque-worker
  BASE_IMAGE: ghcr.io/t0msilver/vidtheque-worker-base

jobs:
  # A release whose inputs to this image did not change since the previous
  # release retags that release's image instead of building (publishing.md §4).
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      build: ${{ steps.plan.outputs.build }}
      prev: ${{ steps.plan.outputs.prev }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # image_inputs.sh hashes `uv export`; the same uv as the base job.
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.24"

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build or retag
        id: plan
        run: |
          # A planner that dies must fail the release, never leave `build` unset.
          set -o pipefail
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            # Not a release: build, and exercise the planner against the last release.
            scripts/release_plan.sh worker "$(git describe --tags --abbrev=0 --match 'v[0-9]*')"
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          scripts/release_plan.sh worker "$GITHUB_REF_NAME" | tee plan.txt
          # A retag needs the previous image; a release that never published one builds.
          if grep -qx 'build=false' plan.txt; then
            prev=$(sed -n 's/^prev=//p' plan.txt)
            docker buildx imagetools inspect "$IMAGE:$prev" >/dev/null 2>&1 \
              || { echo "$IMAGE:$prev is not in the registry, building"; sed -i 's/^build=false$/build=true/' plan.txt; }
          fi
          cat plan.txt >> "$GITHUB_OUTPUT"

  retag:
    needs: plan
    if: needs.plan.outputs.build == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      # Registry-side: the new tags point at the previous release's manifest
      # list, so the box's pull of an unchanged image moves no bytes.
      - name: Retag the previous release
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          PREV: ${{ needs.plan.outputs.prev }}
        run: |
          args=()
          while IFS= read -r t; do [[ -n "$t" ]] && args+=(-t "$t"); done <<< "$TAGS"
          docker buildx imagetools create "${args[@]}" "$IMAGE:$PREV"
          docker buildx imagetools inspect "$IMAGE:${GITHUB_REF_NAME#v}"

  base:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.inputs.outputs.tag }}
      exists: ${{ steps.inputs.outputs.exists }}
    steps:
      - uses: actions/checkout@v4

      # A CUDA runtime base plus torch wheels does not fit beside the
      # preinstalled toolchains on a stock runner.
      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      # The base tag hashes `uv export`; pin the uv the Dockerfiles use.
      # After the reclaim: setup-uv installs into the tools directory it wipes.
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.24"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute base inputs
        id: inputs
        run: |
          tag=$(scripts/image_inputs.sh worker --tag)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if docker buildx imagetools inspect "$BASE_IMAGE:$tag" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build base for pull request
        if: steps.inputs.outputs.exists != 'true' && !startsWith(github.ref, 'refs/tags/')
        uses: docker/build-push-action@v6
        with:
          context: .
          file: worker/Dockerfile.base
          platforms: linux/amd64
          push: false
          tags: ${{ env.BASE_IMAGE }}:${{ steps.inputs.outputs.tag }}

      - name: Build and push base
        if: steps.inputs.outputs.exists != 'true' && startsWith(github.ref, 'refs/tags/')
        uses: docker/build-push-action@v6
        with:
          context: .
          file: worker/Dockerfile.base
          platforms: linux/amd64
          push: true
          tags: ${{ env.BASE_IMAGE }}:${{ steps.inputs.outputs.tag }}

  image:
    # A pull request builds it too, without pushing, when its base is already in the registry.
    if: startsWith(github.ref, 'refs/tags/') || needs.base.outputs.exists == 'true'
    needs: [plan, base]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,format=short

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: worker/Dockerfile
          platforms: linux/amd64
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          build-args: BASE_IMAGE=${{ env.BASE_IMAGE }}:${{ needs.base.outputs.tag }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
