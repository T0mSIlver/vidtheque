name: android

on:
  push:
    branches: [main]
    tags: ["android-v*"]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: android

jobs:
  build:
    name: build, tests, screenshots
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # One stable key, so each build installs over the last and the instance's
      # assetlinks.json fingerprint keeps matching. Absent (forks): the debug key.
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/vidtheque.keystore"
            echo "VIDTHEQUE_KEYSTORE=$RUNNER_TEMP/vidtheque.keystore" >> "$GITHUB_ENV"
          fi

      - name: Build and test
        env:
          VIDTHEQUE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VIDTHEQUE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: ./gradlew --console=plain assembleRelease verifyRoborazziDebug

      - name: Screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-diffs
          path: android/app/build/outputs/roborazzi/

      - uses: actions/upload-artifact@v7
        with:
          name: vidtheque-apk
          path: android/app/build/outputs/apk/release/*.apk

      - name: Attach the APK to the release
        if: startsWith(github.ref, 'refs/tags/android-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "vidtheque-${GITHUB_REF_NAME#android-v}.apk"
          gh release create "$GITHUB_REF_NAME" --title "Android ${GITHUB_REF_NAME#android-v}" --notes "" \
            "vidtheque-${GITHUB_REF_NAME#android-v}.apk" || gh release upload "$GITHUB_REF_NAME" --clobber "vidtheque-${GITHUB_REF_NAME#android-v}.apk"

  # The hosted runners have KVM, this repo's dev box does not: the real-device
  # check runs here. Maestro drives the APK the build job signed.
  emulator:
    name: emulator flows
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          name: vidtheque-apk
          path: android/apk

      - name: Enable KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Maestro
        working-directory: .
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: android
          script: |
            adb install -r apk/app-release.apk
            maestro test maestro/ --test-output-dir=maestro-out

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: emulator-screens
          path: android/maestro-out/
