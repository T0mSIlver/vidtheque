name: android-release

# Its own workflow because android.yml filters on paths, and a tag push carries
# no changed files, so a paths filter would skip every release (build-worker.yml).
on:
  push:
    tags: ["android-v*"]

defaults:
  run:
    working-directory: android

permissions:
  contents: write

jobs:
  release:
    name: build and attach the APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "ANDROID_KEYSTORE_B64 is not set: a release must carry the CI key"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/vidtheque.keystore"
          echo "VIDTHEQUE_KEYSTORE=$RUNNER_TEMP/vidtheque.keystore" >> "$GITHUB_ENV"

      - name: Build
        env:
          VIDTHEQUE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VIDTHEQUE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          # The Firebase project's app identity (Actions variables, not secrets); unset, no push.
          FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_PROJECT_NUMBER: ${{ vars.FIREBASE_PROJECT_NUMBER }}
        # The tag names the version; no instance is prefilled in a public build.
        run: ./gradlew --console=plain assembleRelease "-Pvidtheque.version=${GITHUB_REF_NAME#android-v}" -Pvidtheque.instance=

      - name: Attach the APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#android-v}"
          apk="vidtheque-$version.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          sha256=$("$apksigner" verify --print-certs "$apk" | sed -n 's/^.*certificate SHA-256 digest: //p' | head -1)
          test -n "$sha256" || { echo "no signing certificate digest"; exit 1; }
          sed -e "s/{version}/$version/g" -e "s/{sha256}/$sha256/g" release-notes.md > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" --title "Android $version" --notes-file "$RUNNER_TEMP/notes.md" "$apk" \
            || { gh release upload "$GITHUB_REF_NAME" --clobber "$apk" && gh release edit "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"; }
