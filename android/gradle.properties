org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
# The instance the sign-in screen offers first; the reader can type any other.
vidtheque.instance=https://private.vidtheque.dev
# The instance whose server holds the Firebase key (VIDTHEQUE_FCM_CREDENTIALS) of the
# project the FIREBASE_* values name: push works there only.
vidtheque.pushInstance=https://private.vidtheque.dev
