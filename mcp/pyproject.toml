[project]
name = "vidtheque-mcp"
version = "0.1.0"
description = "vidtheque MCP server — corpus index, OAuth authorization server, and the 9-tool surface"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    # Official SDK v2: the only stable Python option that speaks the
    # 2026-07-28 revision (research/mcp-framework-oauth-research.md §6.1).
    "mcp>=2.0,<3.0",
    "starlette>=0.47",
    "uvicorn>=0.35",
    # HS256 access tokens; the [crypto] extra keeps asymmetric algorithms
    # available if a JWKS verifier mode is ever added.
    "pyjwt[crypto]>=2.10",
    # Worker calls and CIMD document fetch. httpx2 is what mcp 2.0 itself uses;
    # note the import name is `httpx2`, not `httpx`.
    "httpx2>=2.9",
    "pydantic>=2.11",
    # The management dashboard's templating (docs/design/dashboard.md §10.2).
    # Until now the only server-rendered HTML was the OAuth login page's
    # f-string (auth/login.py) — fine for two forms, wrong for a page that
    # renders OCR lines, video titles and yt-dlp error strings, every one of
    # them attacker-controlled. Jinja2 with `autoescape=True` makes escaping
    # the default and `| safe` the audited exception, which is the property
    # demo-site.md §6.2 already demands of the JS side.
    "jinja2>=3.1.6",
    # Vector legs. Alpha, brute-force KNN — see index-schema.md §3.
    "sqlite-vec>=0.1.9",
    # ---------------------------------------------------------------- pipeline
    # The indexing half. Versions are the ones verified in
    # research/pipeline-tooling-research.md §7; none of them pulls a CUDA wheel,
    # which is the rule for this image (mcp/Dockerfile).
    #
    # `deno` is not optional any more: YouTube extraction needs a JS runtime and
    # yt-dlp ships `yt-dlp-ejs` in `default` (§5.0). The PyPI Deno
    # redistribution keeps it inside the venv instead of the image.
    # `curl-cffi` supplies the impersonation target both live runs asked for.
    "yt-dlp[default,curl-cffi,deno]>=2026.7.4",
    # `-headless`, i.e. opencv-python-headless: OCR (which forces the GUI build
    # of opencv) lives on the worker, so this image needs no libGL. Pinned
    # below 0.8 as the project's own docs instruct (§4.1).
    "scenedetect-headless[pyav]==0.7.1",
    # PyAV, already installed by the `[pyav]` extra above, is now *imported* by
    # the pipeline rather than only used through PySceneDetect's backend: pass 1
    # subclasses `VideoStreamAv` and drives a persistent
    # `av.video.reformatter.VideoReformatter` so the colour conversion happens at
    # 256 px instead of 1080p (research/pipeline-perf-2026-08-09.md §3.3). A
    # direct import gets a direct dependency — otherwise dropping the extra, or
    # scenedetect changing which backends it pulls, breaks the keyframe stage
    # with an ImportError and nothing in this file explains why. Same 18.0.0 the
    # extra resolves to; no new wheel enters the image.
    "av>=18.0,<19.0",
    # phash/dhash for near-duplicate keyframes (§4.4). Pure Python over
    # Pillow + numpy + scipy.
    "ImageHash==4.3.2",
    # np.bitwise_count, the popcount the dedup matrix is built on, is NumPy 2.0+.
    "numpy>=2.0",
]

[project.scripts]
vidtheque-mcp = "vidtheque_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vidtheque_mcp"]
